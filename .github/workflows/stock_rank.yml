name: Daily Strong US Stock Screener

on:
  schedule:
    # 1. 美股收市定稿（冬夏令聯集：20:45 UTC 夏令 / 21:45 UTC 冬令，由下方紐約時區閘門自動過濾）
    - cron: '45 20,21 * * 1-5'

    # 2. 港澳傍晚 18:00 覆盤（對應美股週一至五收市，全年免改）
    - cron: '0 10 * * 2-6'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-stock-rs-bot
  cancel-in-progress: false

jobs:
  run-stock-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check NY Timezone Gate (Auto DST)
        id: time_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - << 'EOF'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          ny_now = datetime.now(ZoneInfo("America/New_York"))

          should_run = False
          if event_name != "schedule":
              should_run = True
          elif schedule == "0 10 * * 2-6":
              should_run = True
          else:
              # 只放行紐約時間 16:35 至 17:34（即美股收市後定稿視窗），自動略過另一時令嘅多餘觸發
              ny_min = ny_now.hour * 60 + ny_now.minute
              if ny_now.weekday() < 5 and (16 * 60 + 35) <= ny_min < (17 * 60 + 35):
                  should_run = True

          print(f"NY Time: {ny_now.strftime('%Y-%m-%d %H:%M %Z')} | should_run={should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
          EOF

      - name: Checkout Repository
        if: steps.time_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        if: steps.time_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.time_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Screener
        if: steps.time_gate.outputs.should_run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and Push stock_history.json
        if: steps.time_gate.outputs.should_run == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f stock_history.json ]; then
            git add stock_history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update stock ranking history [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"🚨 **US-Stock-RS-Bot 執行失敗**\\n請查看日誌：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
                 "$DISCORD_WEBHOOK_URL"
          fi
