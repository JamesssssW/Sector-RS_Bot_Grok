name: Daily Sector RS Ranking

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 美股收盤後
  workflow_dispatch:

permissions:
  contents: write   # 允許 commit previous_ranking.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Sector RS Bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Commit updated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previous_ranking.json
          git diff --staged --quiet || git commit -m "Update previous_ranking.json [skip ci]"
          git push
